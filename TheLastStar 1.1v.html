    g.fillStyle=C.pl2; g.fillRect(Math.round(cr.x),Math.round(cr.y)-1,cr.r*2,1);
  }

  // луна (только на главном экране, чтобы не наезжала на заголовки)
  if(!withMoon) return c;
  var mx=Math.round(W*0.84), my=Math.round(H*0.075), mr=5;
  for(var y=-mr;y<=mr;y++) for(var x=-mr;x<=mr;x++){
    var d=Math.sqrt(x*x+y*y); if(d>mr) continue;
    var l=((-x*0.7-y*0.7)/mr+1)/2;
    g.fillStyle = l>thr(x+mx,y+my)+0.15 ? C.bone : C.dim;
    g.fillRect(mx+x,my+y,1,1);
  }
  g.fillStyle=C.dim; g.fillRect(mx+1,my+1,2,1); g.fillRect(mx-3,my+2,1,1);
  return c;
}

function buildStars(){
  var r=rnd(1234), n=Math.round(W*H/150); stars=[];
  for(var i=0;i<n;i++){
    stars.push({x:Math.floor(r()*W), y:Math.floor(r()*H*0.86), big:r()<0.07,
      ph:Math.floor(r()*12), per:8+Math.floor(r()*10), warm:r()<0.18});
  }
}

/* ---------- звезда ---------- */
function starCenter(){
  var r=slot.getBoundingClientRect();
  if(!r.height || slot.offsetParent===null) return null;
  return {x:Math.round((r.left+r.width/2)/P), y:Math.round((r.top+r.height/2)/P), R:Math.round(Math.min(r.width,r.height)/P*starK), lim:Math.floor(Math.min(r.width,r.height)/P/2/1.45)};
}
function drawStar(g,s){
  var pulse = reduce ? 0 : Math.round(Math.sin(frame*0.18)*1.2);
  var R = Math.min(s.R + pulse + Math.round(bump) + starGrow, s.lim||99);
  var cx=s.x, cy=s.y;
  // лучи
  var len=Math.round(R*0.55);
  for(var i=1;i<=len;i++){
    var w = i<len*0.45?2:1;
    g.fillStyle = i<len*0.5 ? C.sun : C.ember;
    g.fillRect(cx-1,cy-R-i,w,1); g.fillRect(cx-1,cy+R+i-1,w,1);
    g.fillRect(cx-R-i,cy-1,1,w); g.fillRect(cx+R+i-1,cy-1,1,w);
  }
  var dl=Math.round(R*0.28);
  for(var j=1;j<=dl;j++){
    g.fillStyle = j<dl*0.6?C.ember:C.rust;
    var o=Math.round(R*0.72)+j;
    g.fillRect(cx-o,cy-o,1,1); g.fillRect(cx+o-1,cy-o,1,1);
    g.fillRect(cx-o,cy+o-1,1,1); g.fillRect(cx+o-1,cy+o-1,1,1);
  }
  // диск: четыре слоя, границы вперемешку
  for(var y=-R-1;y<=R;y++) for(var x=-R-1;x<=R;x++){
    var dx=x+0.5, dy=y+0.5, d=Math.sqrt(dx*dx+dy*dy)/R;
    if(d>1.04) continue;
    var l=((-dx*0.5-dy*0.7)/R*0.5)+d*1.0; // смещённый «свет»: центр чуть левее-выше
    var v=l*3.2; var step=Math.floor(v), fr=v-step;
    var tone = fr>thr(x+cx,y+cy)?step+1:step;
    if(d>1) tone=Math.max(tone,3);
    var col = tone<=0?C.core: tone===1?C.sun: tone===2?C.ember: C.rust;
    if(d>1.0 && tone>3) continue;
    g.fillStyle=col; g.fillRect(cx+x,cy+y,1,1);
  }
  // пятна на звезде
  g.fillStyle=C.ember;
  g.fillRect(cx+Math.round(R*0.25),cy-Math.round(R*0.2),2,1);
  g.fillRect(cx-Math.round(R*0.35),cy+Math.round(R*0.3),1,1);
  g.fillRect(cx+Math.round(R*0.1),cy+Math.round(R*0.45),2,1);
}

/* ---------- искры ---------- */
function burst(n){
  var s=starCenter(); if(!s) return;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, sp=0.6+Math.random()*1.6;
    sparks.push({x:s.x+Math.cos(a)*s.R*0.8, y:s.y+Math.sin(a)*s.R*0.8,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-0.3, life:12+Math.floor(Math.random()*12),
      big:Math.random()<0.3, c:[C.core,C.sun,C.ember,C.bone][Math.floor(Math.random()*4)]});
  }
}

function draw(){
  ctx.drawImage(bg,0,0);
  // звёзды
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var ph = reduce ? 0 : (frame+s.ph)%s.per;
    var on = ph < s.per*0.7;
    if(!on && !s.big) continue;
    var col = s.warm?C.sun:C.bone;
    ctx.fillStyle = on?col:C.dim;
    ctx.fillRect(s.x,s.y,1,1);
    if(s.big && on){
      ctx.fillStyle=C.dim;
      ctx.fillRect(s.x-1,s.y,1,1); ctx.fillRect(s.x+1,s.y,1,1);
      ctx.fillRect(s.x,s.y-1,1,1); ctx.fillRect(s.x,s.y+1,1,1);
    }
  }
  var sc=starCenter(); if(sc) drawStar(ctx,sc);
  for(var k=0;k<sparks.length;k++){
    var p=sparks[k]; ctx.fillStyle=p.c;
    var z=p.big?2:1; ctx.fillRect(Math.round(p.x),Math.round(p.y),z,z);
  }
  if(onGame&&gameDraw) gameDraw(ctx);
}

function tick(){
  frame++;
  bump *= 0.7; if(bump<0.3) bump=0;
  if(onGame&&typeof gameStep==="function") gameStep();
  for(var i=sparks.length-1;i>=0;i--){
    var p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    if(p.life<=0) sparks.splice(i,1);
  }
  if(!document.hidden) draw();
}

var SUF = ["","К","М","Мрд","Трл","Квдр","Квнт"];
function fmt(n){
  if(!isFinite(n)) return "много";
  n = Math.max(0,n);
  if(n < 1000){
    if(n < 10 && n !== Math.floor(n)) return (Math.floor(n*10)/10).toString().replace(".",",");
    return String(Math.floor(n));
  }
  var i = Math.min(Math.floor(Math.log10(n)/3), SUF.length-1), v = n/Math.pow(1000,i);
  var s = v>=100 ? v.toFixed(0) : v>=10 ? v.toFixed(1) : v.toFixed(2);
  if(s.indexOf(".")>=0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s.replace(".",",") + SUF[i];
}
function mmss(ms){
  var s = Math.max(0, Math.ceil(ms/1000)), m = Math.floor(s/60), h = Math.floor(m/60);

  return h ? h+":"+p(m%60)+":"+p(s%60) : m+":"+p(s%60);
}

function refreshGrow(){
  var g = dustFor(S.run), armed = Date.now() < novaArm;
  setT(novaRef.ds, S.dust ? "Пыль: "+S.dust+" (+"+Math.round(S.dust*DUST_BONUS*100)+"% к доходу)" : "Звезда взрывается, карта гаснет, а пыль остаётся навсегда");
  setT(novaRef.btn, g>=1 ? (armed ? "Точно? Нажми ещё раз" : "Взорвать звезду: +"+g+" пыли") : "Нужно "+fmt(2e6)+" энергии за забег");
  setCls(novaRef.btn, "ready", g>=1);
  if(novaRef.top !== (g>=1)){
    novaRef.top = (g>=1);
    if(novaRef.top) growEl.insertBefore(novaRef.box, growEl.firstChild); else growEl.appendChild(novaRef.box);
  }
  var lockedShown = false;
  itemRefs.forEach(function(r){
    var u = r.u, lv = S.lv[u.id], unlocked = lv>0 || S.run >= u.base*0.4;
    if(!unlocked){
      if(lockedShown){ r.b.hidden = true; return; }
      lockedShown = true; r.b.hidden = false;
      setT(r.nm,"???"); setT(r.ds,"Откроется при "+fmt(u.base*0.4)+" энергии"); setT(r.cs,"");
      r.b.classList.add("lock"); r.b.classList.remove("can"); return;
    }
    r.b.hidden = false; r.b.classList.remove("lock");
    var c = cost(u);
    setT(r.nm, u.name + (lv ? "  ур."+lv : ""));
    var v = u.val * mult() * (u.kind==="tap" && S.tapPerm ? 2 : 1);
    setT(r.ds, "+"+fmt(v)+(u.kind==="tap" ? " к тапу" : " в секунду"));
    setT(r.cs, fmt(c)); setCls(r.b, "can", S.e >= c);
  });
}
function supernova(){
  var g = dustFor(S.run); if(g < 1) return;
  var keep = {dust:S.dust+g, nova:S.nova+1, ach:S.ach, boostUntil:S.boostUntil, tapPerm:S.tapPerm, taps:S.taps, total:S.total, meteors:S.meteors, noticeSeen:S.noticeSeen};
  var ns = newState(); for(var k in keep) ns[k] = keep[k];
  S = ns; sel = 0; burst(90); bump = 9; buzz(60);
  blip(110,.35,"sawtooth",.07); setTimeout(function(){ blip(220,.3,"square",.05); },120); setTimeout(function(){ blip(440,.4,"square",.05); },260);
  toast("Сверхновая! Пыль: "+S.dust+", доход +"+Math.round(S.dust*DUST_BONUS*100)+"%");
  checkAch(); save();
}

/* ---------- вкладка «Карта» ---------- */
var mapCv = document.getElementById("mapCv"), mctx = mapCv.getContext("2d");
var mapInfo = {nm:document.getElementById("mapNm"), bn:document.getElementById("mapBn"), st:document.getElementById("mapSt"), btn:document.getElementById("mapBtn")};
var journalEl = document.getElementById("journal");
var sel = 0, mw = 0, mh = 0, mapSeed = null;
function layoutMap(){
  var pane = document.getElementById("paneMap");
  if(pane.hidden) return;
  var inner = pane.clientWidth - 24; if(inner < 80) return;
  var w = Math.floor(inner / P), h = Math.floor(w * 0.62);
  if(w !== mw || h !== mh){
    mw = w; mh = h; mapCv.width = w; mapCv.height = h;
    mapCv.style.width = w*P+"px"; mapCv.style.height = h*P+"px";
    var r = rnd(99); mapSeed = []; for(var i=0;i<Math.round(w*h/40);i++) mapSeed.push([Math.floor(r()*w), Math.floor(r()*h), r()<0.2]);
  }
  drawMap();
}
function spos(i){ return [Math.round(6 + STARS[i].x*(mw-12)), Math.round(6 + STARS[i].y*(mh-12))]; }
function mline(a, b, col){
  var x0=a[0], y0=a[1], x1=b[0], y1=b[1], dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, er=dx+dy, n=0;
  mctx.fillStyle = col;
  for(;;){
    if(n++ % 2 === 0) mctx.fillRect(x0,y0,1,1);
    if(x0===x1 && y0===y1) break;
    var e2 = 2*er; if(e2>=dy){ er+=dy; x0+=sx; } if(e2<=dx){ er+=dx; y0+=sy; }
  }
}
function drawMap(){
  if(!mw) return;
  mctx.fillStyle = "#0e1a22"; mctx.fillRect(0,0,mw,mh);
  mapSeed.forEach(function(s){ mctx.fillStyle = s[2] ? "#2b4252" : "#1b2e3a"; mctx.fillRect(s[0],s[1],1,1); });
  EDGES.forEach(function(e){
    var both = S.stars.indexOf(e[0])>=0 && S.stars.indexOf(e[1])>=0;
    mline(spos(e[0]), spos(e[1]), both ? C.sun : "#22333f");
  });
  var tw = Math.floor(frame/4) % 2;
  STARS.forEach(function(st, i){
    var p = spos(i), x = p[0], y = p[1], lit = S.stars.indexOf(i) >= 0;
    if(lit){
      mctx.fillStyle = C.ember;
      for(var oy=-2;oy<=2;oy++) for(var ox=-2;ox<=2;ox++){ if(Math.abs(ox)+Math.abs(oy)<=2) mctx.fillRect(x+ox,y+oy,1,1); }
      mctx.fillStyle = C.sun;   mctx.fillRect(x-1,y,3,1); mctx.fillRect(x,y-1,1,3);
      mctx.fillStyle = C.core;  mctx.fillRect(x,y,1,1);
      var L = tw ? 4 : 3; mctx.fillStyle = C.sun;
      mctx.fillRect(x-L,y,1,1); mctx.fillRect(x+L,y,1,1); mctx.fillRect(x,y-L,1,1); mctx.fillRect(x,y+L,1,1);
    } else {
      mctx.fillStyle = "#3b4d5a"; mctx.fillRect(x-1,y,3,1); mctx.fillRect(x,y-1,1,3);
    }
    if(i === sel){
      mctx.fillStyle = C.bone;
      [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){
        var cx = x+q[0]*6, cy = y+q[1]*6;
        mctx.fillRect(cx,cy,1,1); mctx.fillRect(cx-q[0],cy,1,1); mctx.fillRect(cx,cy-q[1],1,1);
      });
    }
  });
}
mapCv.addEventListener("pointerdown", function(e){
  var r = mapCv.getBoundingClientRect(), x = (e.clientX-r.left)/P, y = (e.clientY-r.top)/P, best = -1, bd = 12;
  STARS.forEach(function(s,i){ var p = spos(i), d = Math.hypot(p[0]-x, p[1]-y); if(d < bd){ bd = d; best = i; } });
  if(best >= 0){ sel = best; blip(392,.05,"square",.03); refreshMap(); drawMap(); }
});
mapInfo.btn.addEventListener("click", function(){
  var s = STARS[sel];
  if(S.stars.indexOf(sel) >= 0) return;
  if(S.e < s.cost){ deny(); return; }
  S.e -= s.cost; S.stars.push(sel); S.stars.sort(function(a,b){return a-b;});
  burst(40); bump = 6; blip(659,.1,"square",.05); setTimeout(function(){ blip(988,.14,"square",.05); },90); buzz(30);
  toast("Зажглась звезда «"+s.name+"»: +"+Math.round(s.bonus*100)+"% к доходу");
  checkAch(); refreshMap(); drawMap();
});
function refreshMap(){
  var s = STARS[sel], lit = S.stars.indexOf(sel) >= 0;
  setT(mapInfo.nm, s.name);
  setT(mapInfo.bn, "+"+Math.round(s.bonus*100)+"% к доходу");
  setT(mapInfo.st, lit ? s.story : "Эта звезда ещё не горит. Свет до неё не дошёл.");
  setT(mapInfo.btn, lit ? "Горит" : "Зажечь за "+fmt(s.cost));
  setCls(mapInfo.btn, "can", !lit && S.e >= s.cost); mapInfo.btn.disabled = lit;
  var key = S.stars.join(",");
  if(journalEl._k !== key){
    journalEl._k = key; journalEl.textContent = "";
    if(!S.stars.length) journalEl.appendChild(mk("p","ds","Записи появятся, когда загорится первая звезда."));
    S.stars.forEach(function(i){
      var d = mk("div","jr"); d.append(mk("div","nm",STARS[i].name), mk("p","ds",STARS[i].story)); journalEl.appendChild(d);
    });
  }
}

/* ---------- вкладка «Награды» ---------- */
var achEl = document.getElementById("paneAch"), achRefs = [];
function buildAch(){
  achEl.textContent = ""; achRefs = [];
  ACH.forEach(function(a){
    var row = mk("div","item ach"), nm = mk("span","nm",a.name), ds = mk("span","ds",a.d), bn = mk("span","cs","+"+Math.round(a.b*100)+"%"), bar = mk("span","bar"), fill = mk("i");
    bar.appendChild(fill); row.append(nm, ds, bn, bar); achEl.appendChild(row);
    achRefs.push({a:a, row:row, fill:fill});
  });
}
function refreshAch(){
  achRefs.forEach(function(r){
    var p = r.a.p(), done = !!S.ach[r.a.id], pc = Math.min(100, Math.floor(p[0]/p[1]*100));
    setCls(r.row, "done", done);
    var w = (done ? 100 : pc) + "%"; if(r.fill._w !== w){ r.fill.style.width = w; r.fill._w = w; }
  });
}

/* ---------- вкладка «Донат» ---------- */
var shopEl = document.getElementById("paneShop"), shopTime;
function buildShop(){
  shopEl.textContent = "";
  shopEl.appendChild(mk("p","ds shopnote","Донат необязателен. Игра проходится и без него."));
  SHOP.forEach(function(it){
    var b = mk("button","item can"), nm = mk("span","nm",it.name), ds = mk("span","ds",it.ds), cs = mk("span","cs","скоро");
    b.append(nm, ds, cs); b.addEventListener("click", function(){ buyShop(it); });
    shopEl.appendChild(b);
  });
}

/* ---------- метеориты ---------- */
var M = null, nextMeteor = Date.now() + 25000;
function stageL(){ var r = stage.getBoundingClientRect(); return {x:r.left/P, y:r.top/P, w:r.width/P, h:r.height/P}; }
function spawnMeteor(){
  var R = stageL(), left = Math.random() < 0.5;
  M = {x:R.x + (left ? -4 : R.w+4), y:R.y + R.h*(0.08 + Math.random()*0.35), vx:(left?1:-1)*(R.w+8)/44, vy:(R.h*0.45)/44, life:0};
}
function gameStep(){
  var now = Date.now();
  if(!M && now > nextMeteor){ spawnMeteor(); nextMeteor = now + 40000 + Math.random()*40000; }
  if(M){ M.x += M.vx; M.y += M.vy; M.life++; if(M.life > 60) M = null; }
  starGrow = Math.min(S.stars.length, 8);
  if(frame % 2 === 0 && !document.getElementById("paneMap").hidden) drawMap();
}
gameDraw = function(g){
  if(!M) return;
  for(var i=9;i>=1;i--){
    g.fillStyle = i>6 ? C.rust : i>3 ? C.ember : C.sun;
    var z = i>6 ? 2 : 3;
    g.fillRect(Math.round(M.x - M.vx*i*0.4), Math.round(M.y - M.vy*i*0.4), z, z);
  }
  var hx = Math.round(M.x), hy = Math.round(M.y);
  g.fillStyle = C.ember; g.fillRect(hx-3,hy-2,6,5); g.fillRect(hx-2,hy-3,4,7);
  g.fillStyle = C.sun;   g.fillRect(hx-2,hy-1,4,3);
  g.fillStyle = C.core;  g.fillRect(hx-1,hy-1,2,2);
};

/* ---------- тап по сцене ---------- */
var tapN = 0, lastTapBlip = 0;
stage.addEventListener("pointerdown", function(e){
  e.preventDefault();
  var r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if(M && Math.hypot(e.clientX/P - M.x, e.clientY/P - M.y) < 10){
    var reward = Math.max(ips()*40, tapPower()*40);
    gain(reward); S.meteors++; M = null; burst(30); buzz(25);
    blip(880,.08,"square",.05); setTimeout(function(){ blip(1175,.12,"square",.05); },70);
    floatText("+"+fmt(reward), x, y, "big"); toast("Метеорит пойман: +"+fmt(reward));
    checkAch(); return;
  }
  var g = tapPower(); gain(g); S.taps++; bump = 3; burst(7); buzz(6);
  var n = Date.now(); if(n - lastTapBlip > 70){ blip(notes[tapN % notes.length]*1.5, .05, "square", .035); lastTapBlip = n; }
  tapN++;
  floatText("+"+fmt(g), x + (Math.random()*24-12), y - 10);
});

/* ---------- вкладки ---------- */
var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
function openTab(name){
  tabs.forEach(function(t){
    var on = t.getAttribute("data-tab") === name;
    t.setAttribute("aria-selected", on ? "true" : "false");
    document.getElementById("pane"+t.getAttribute("data-tab")).hidden = !on;
  });
  if(name === "Map"){ layoutMap(); refreshMap(); }
}
tabs.forEach(function(t){ t.addEventListener("click", function(){ blip(440,.04,"square",.03); openTab(t.getAttribute("data-tab")); }); });

/* ---------- уведомление администрации ---------- */
var noticeEl = document.getElementById("notice"), noticeTx = document.getElementById("noticeText");
function renderNotice(){
  setT(noticeTx, NOTICE.text);
  noticeEl.hidden = (S.noticeSeen === NOTICE.id);
}
document.getElementById("noticeX").addEventListener("click", function(){ S.noticeSeen = NOTICE.id; renderNotice(); blip(330,.04,"square",.03); save(); setTimeout(layoutMap,0); });
if(NOTICE_URL){
  try{
    fetch(NOTICE_URL, {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.text){ NOTICE = {id:String(j.id||j.text.length), text:String(j.text)}; renderNotice(); }
    }).catch(function(){});
  }catch(e){}
}

/* ---------- офлайн-доход ---------- */
var pendingAway = 0, awaySec = 0;
function checkAway(){
  var away = (Date.now() - S.last)/1000;
  if(away > 60 && ips() > 0){
    awaySec = Math.min(away, 28800); pendingAway = ips()*awaySec*0.5;
    if(onGame) showAway();
  }
}
function showAway(){
  if(pendingAway <= 0) return;
  var m = Math.floor(awaySec/60), h = Math.floor(m/60);
  document.getElementById("offText").textContent = "Прошло " + (h ? h+" ч "+(m%60)+" мин" : m+" мин") + ". Пока тебя не было, звёзды копили энергию: +" + fmt(pendingAway) + ".";
  document.getElementById("offModal").hidden = false;
}
document.getElementById("offBtn").addEventListener("click", function(){
  gain(pendingAway); pendingAway = 0; document.getElementById("offModal").hidden = true; blip(659,.08,"square",.05); S.last = Date.now(); save();
});

/* ---------- цикл ---------- */
var lastT = Date.now(), saveT = 0, achT = 0;
var engEl = document.getElementById("eng"), ipsEl = document.getElementById("ips"), mulEl = document.getElementById("mul"), boostEl = document.getElementById("boost");
function refreshAll(){
  setT(engEl, fmt(S.e));
  setT(ipsEl, "+"+fmt(ips())+"/с");
  var m = mult(); setT(mulEl, "доход x"+(Math.round(m*100)/100).toString().replace(".",","));
  if(boostOn()){ boostEl.hidden = false; setT(boostEl, "x2 "+mmss(S.boostUntil-Date.now())); } else boostEl.hidden = true;
  if(!document.getElementById("paneGrow").hidden) refreshGrow();
  if(!document.getElementById("paneMap").hidden) refreshMap();
  if(!document.getElementById("paneAch").hidden) refreshAch();
}
setInterval(function(){
  var now = Date.now(), dt = Math.min((now-lastT)/1000, 5); lastT = now;
  var p = ips(); if(p > 0) gain(p*dt);
  achT += dt; if(achT > 0.5){ achT = 0; checkAch(); }
  saveT += dt; if(saveT > 5){ saveT = 0; save(); }
  if(onGame) refreshAll();
}, 100);
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ save(); }
  else { lastT = Date.now(); checkAway(); }
});
window.addEventListener("pagehide", save);

/* ---------- вход и выход ---------- */
function gameEnter(){
  renderNotice(); openTab(tabs.filter(function(t){ return t.getAttribute("aria-selected")==="true"; })[0].getAttribute("data-tab"));
  refreshAll(); showAway();
}
function gameLeave(){ save(); }

/* ---------- сброс прогресса ---------- */
var resetBtn = document.getElementById("optReset"), resetArm = 0;
resetBtn.addEventListener("click", function(){
  if(Date.now() > resetArm){ resetArm = Date.now() + 3500; resetBtn.textContent = "Точно? Нажми ещё раз"; setTimeout(function(){ if(Date.now() >= resetArm) resetBtn.textContent = "Сбросить прогресс"; }, 3600); blip(300,.06); return; }
  resetArm = 0; S = newState(); sel = 0; M = null; pendingAway = 0; save();
  resetBtn.textContent = "Прогресс сброшен"; blip(150,.2,"sawtooth",.05);
  setTimeout(function(){ resetBtn.textContent = "Сбросить прогресс"; }, 2000);
});

buildGrow(); buildAch(); buildShop(); refreshAll(); checkAway();
if(DEBUG) window.__ls = {S:function(){return S;}, fmt:fmt, tapPower:tapPower, ips:ips, mult:mult, setS:function(o){ for(var k in o) S[k]=o[k]; }, lightStar:lightStar, supernova:supernova, spawnMeteor:spawnMeteor, meteor:function(){return M;}, buyShop:buyShop, SHOP:SHOP};

window.addEventListener("resize",function(){ resize(); if(onGame) layoutMap(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ draw(); });
resize();
})();
</script>

</body></html>
